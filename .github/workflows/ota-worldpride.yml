name: OTA · WorldPride (runtime 1.3.0)

# Manual-trigger OTA publish for the date-gated WorldPride Canal Parade layer.
#
# WHY THIS EXISTS
#   The layer is on TestFlight (1.4.0 / build #18) but not the live App Store
#   app. With runtimeVersion policy 'appVersion', an OTA is only seen by the
#   binary whose app version matches its tag. This job checks out the
#   ota/worldpride-1.3.0 branch (app.config pinned to 1.3.0), so the update is
#   tagged runtime "1.3.0" and the LIVE App Store build (#16, v1.3.0) receives
#   it. The 1.4.0 TestFlight build listens for "1.4.0" and is unaffected.
#
# SECRETS
#   EXPO_TOKEN                        (REQUIRED) Expo access token —
#                                     expo.dev → Account → Settings → Access tokens.
#   EXPO_PUBLIC_GOOGLE_MAPS_API_KEY   (recommended) inlined into the JS bundle;
#                                     without it the detail-card Places info goes blank.
#   EXPO_PUBLIC_REVENUECAT_IOS_KEY    (recommended) inlined into the JS bundle;
#                                     without it RevenueCat won't init → Pro
#                                     purchases/restore stop working (no crash).
#   The two EXPO_PUBLIC_* keys are only needed here if they are NOT already stored
#   as EAS environment variables for the 'production' environment — the publish
#   step passes --environment production, which pulls those automatically. Adding
#   them as GitHub secrets is a belt-and-braces override.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag to bundle (MUST pin app version to 1.3.0)
        default: ota/worldpride-1.3.0
        required: true
      message:
        description: Update message shown in EAS
        default: WorldPride Canal Parade layer (1.3.0 OTA)
        required: true
      expo_token:
        description: >-
          One-time Expo access token. Leave BLANK to use the EXPO_TOKEN repo
          secret. Only use this when you can't add a repo secret. It is visible
          in this run's record — REVOKE it at expo.dev right after the run.
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the one-time token in logs
        if: inputs.expo_token != ''
        run: echo "::add-mask::${{ inputs.expo_token }}"

      - name: Checkout the 1.3.0-pinned tree
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Guard — bundled app version must be exactly 1.3.0
        run: |
          v=$(grep -oE "version: '[0-9]+\.[0-9]+\.[0-9]+'" app.config.ts | head -1)
          echo "app.config → $v"
          if [ "$v" != "version: '1.3.0'" ]; then
            echo "::error::Refusing to publish: bundled version is not 1.3.0 ($v). An OTA tagged with any other version would NOT reach the live App Store build (#16, v1.3.0) and could regress it. Point 'ref' at a branch whose app.config pins 1.3.0."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI + auth
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # Prefer the one-time dispatch input; fall back to the repo secret.
          token: ${{ inputs.expo_token || secrets.EXPO_TOKEN }}

      # Only export a key if the secret is actually set — an empty export would
      # override the value --environment production pulls from EAS and blank it out.
      - name: Load optional bundle keys (only when provided)
        env:
          G: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          R: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
        run: |
          if [ -n "$G" ]; then echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$G" >> "$GITHUB_ENV"; fi
          if [ -n "$R" ]; then echo "EXPO_PUBLIC_REVENUECAT_IOS_KEY=$R" >> "$GITHUB_ENV"; fi

      - name: Publish OTA → production channel (runtime 1.3.0)
        run: |
          eas update \
            --channel production \
            --environment production \
            --message "${{ inputs.message }}" \
            --non-interactive
